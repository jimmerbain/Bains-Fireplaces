<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bains Fireplaces | Back Office</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#263445;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e1e6eb;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}h2{margin-top:0}small,.muted{color:#778392}.layout{display:flex;min-height:calc(100vh - 74px)}nav{width:235px;background:#fff;border-right:1px solid #e1e6eb;padding:20px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;background:none;color:#445368}nav button.active{background:#e9eff6;color:#183c60}main{padding:28px;flex:1;max-width:1250px;margin:auto}button{cursor:pointer;border:0;padding:11px 15px;border-radius:9px;font-weight:600}button.primary{background:#234c73;color:#fff}button.secondary{background:#eef2f6;color:#25445f}button.danger{color:#a33434;background:#fff3f3}.panel{background:white;border:1px solid #e1e6eb;border-radius:14px;padding:22px;margin:0 0 22px;box-shadow:0 2px 8px #122e4310}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:6px;font-size:13px;font-weight:600}input,select,textarea{padding:11px;border:1px solid #ccd5dd;border-radius:8px;font:inherit;min-width:0;background:white;color:#263445}textarea{min-height:76px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:30px;font-weight:700;margin:8px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f3}th{color:#647484;font-size:12px;text-transform:uppercase}.scroll{overflow:auto}.hidden{display:none}#notice{color:#277146;min-height:20px} @media(max-width:700px){header{padding:14px}.layout{display:block}nav{width:100%;display:flex;overflow:auto;padding:8px}nav button{width:auto;white-space:nowrap}main{padding:14px}.grid,form{grid-template-columns:1fr}.wide{grid-column:1}}@media print{header,nav,.actions,button{display:none!important}main{padding:0}.panel{box-shadow:none}}
</style></head><body><header><h1>BAINS FIREPLACES <span class="muted">/ Back Office</span></h1><span class="muted">Bristol · Coventry · Trade · Online</span></header><div class="layout"><nav id="nav"></nav><main><div id="notice" role="status"></div><div id="page"></div></main></div>
<script>
'use strict';
const KEY='bains-fireplaces-v1';let state;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');state={orders:x.orders||[],customers:x.customers||[],dealers:x.dealers||[]}}catch{state={orders:[],customers:[],dealers:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
const pages={dashboard:'Dashboard',orders:'Orders',new:'New order',customers:'Retail customers',prospects:'Prospective dealers',dealers:'Active dealers',displays:'Showroom displays'};
let current='dashboard';function notice(s){document.getElementById('notice').textContent=s;setTimeout(()=>document.getElementById('notice').textContent='',4500)}
function nav(){document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,v])=>'<button class="'+(k===current?'active':'')+'" data-page="'+k+'">'+v+'</button>').join('')}
function go(k){current=k;nav();render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function field(label,name,type='text',value='',extra=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+escapeHtml(value)+'" '+extra+'></label>'}
function select(label,name,options){return '<label>'+label+'<select name="'+name+'">'+options.map(([v,t])=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(t)+'</option>').join('')+'</select></label>'}
function panel(title,html){return '<section class="panel"><h2>'+title+'</h2>'+html+'</section>'}
function rows(headers,items){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+items.join('')+'</tbody></table></div>'}
function render(){const p=document.getElementById('page');if(current==='dashboard'){p.innerHTML='<h2>Overview</h2><div class="grid">'+[['Orders',state.orders.length],['Retail customers',state.customers.length],['Active dealers',state.dealers.filter(d=>d.status==='active').length]].map(([t,v])=>'<div class="panel"><div class="muted">'+t+'</div><div class="metric">'+v+'</div></div>').join('')+'</div>'+panel('Getting started','<p>Enter orders and customer details, and manage trade contacts from the menu.</p><p class="muted">Prototype: data is stored only in this browser, not shared with other staff. Export a backup regularly.</p><div class="actions"><button class="primary" onclick="go(\'new\')">Create order</button><button class="secondary" onclick="backup()">Export backup</button><button class="secondary" onclick="document.getElementById(\'restore\').click()">Import backup</button><input class="hidden" id="restore" type="file" accept="application/json" onchange="restore(event)"></div>');return}
if(current==='new'){const active=state.dealers.filter(d=>d.status==='active');p.innerHTML=panel('New order','<form id="order-form">'+select('Order channel','channel',[['Bristol','Bristol'],['Coventry','Coventry'],['Trade','Trade'],['Internet','Internet']])+'<div id="trade-select" class="hidden">'+select('Active trade dealer','dealerId',[['','Select dealer'],...active.map(d=>[d.id,d.name])])+'</div><div id="retail-fields" class="wide"><div class="grid">'+field('Customer name','customerName')+field('Email','email','email')+field('Telephone','phone')+field('Address','address')+field('Postcode','postcode')+'</div></div>'+field('Order date','date','date',new Date().toISOString().slice(0,10),'required')+field('Product / model','product','text','','required')+field('Quantity','quantity','number',1,'min="1" required')+field('Order value (£)','total','number','','min="0" step="0.01"')+select('Status','status',[['New','New'],['Processing','Processing'],['Dispatched','Dispatched'],['Complete','Complete']])+'<label class="wide">Notes<textarea name="notes"></textarea></label><div class="wide actions"><button class="primary" type="submit">Save order</button></div></form>');const form=document.getElementById('order-form');form.channel.addEventListener('change',()=>{const trade=form.channel.value==='Trade';document.getElementById('trade-select').classList.toggle('hidden',!trade);document.getElementById('retail-fields').classList.toggle('hidden',trade)});form.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));if(d.channel==='Trade'&&!d.dealerId){notice('Select an active dealer');return}if(d.channel!=='Trade'&&!d.customerName.trim()){notice('Enter the retail customer name');return}let customerId=null;if(d.channel!=='Trade'){const existing=state.customers.find(c=>d.email&&c.email.toLowerCase()===d.email.toLowerCase());if(existing){Object.assign(existing,{name:d.customerName,phone:d.phone,address:d.address,postcode:d.postcode});customerId=existing.id}else{customerId=id();state.customers.push({id:customerId,name:d.customerName,email:d.email,phone:d.phone,address:d.address,postcode:d.postcode})}}state.orders.push({id:id(),number:'BF-'+String(Date.now()).slice(-9),customerId,...d});save();go('orders');notice('Order saved')});return}
if(current==='orders'){p.innerHTML=panel('Orders','<div class="actions"><button class="primary" onclick="go(\'new\')">New order</button><button class="secondary" onclick="window.print()">Print page</button></div>'+rows(['Order','Date','Channel','Customer / dealer','Product','Amount','Status'],state.orders.slice().reverse().map(o=>'<tr><td>'+escapeHtml(o.number)+'</td><td>'+escapeHtml(o.date)+'</td><td>'+escapeHtml(o.channel)+'</td><td>'+escapeHtml(o.channel==='Trade'?(state.dealers.find(d=>d.id===o.dealerId)||{}).name:o.customerName)+'</td><td>'+escapeHtml(o.product)+'</td><td>£'+escapeHtml(o.total||'—')+'</td><td>'+escapeHtml(o.status)+'</td></tr>')));return}
if(current==='customers'){p.innerHTML=panel('Retail customers',rows(['Customer','Email','Phone','Address','Postcode'],state.customers.map(c=>'<tr><td>'+escapeHtml(c.name)+'</td><td>'+escapeHtml(c.email)+'</td><td>'+escapeHtml(c.phone)+'</td><td>'+escapeHtml(c.address)+'</td><td>'+escapeHtml(c.postcode)+'</td></tr>')));return}
if(current==='prospects'||current==='dealers'){const active=current==='dealers';p.innerHTML=panel(active?'Active trade dealers':'Prospective trade dealers','<form id="dealer-form">'+field('Business name','name','text','','required')+field('Contact name','contact')+field('Email address','email','email','','required')+field('Telephone','phone')+field('Website','website','url')+field('Town / city','town')+field('Address','address')+field('Postcode','postcode')+'<div class="wide actions"><button class="primary" type="submit">Add '+(active?'active dealer':'prospective dealer')+'</button></div></form>')+panel('Dealer records',rows(['Business','Contact','Email','Telephone','Website','Location','Action'],state.dealers.filter(d=>d.status===(active?'active':'prospect')).map(d=>'<tr><td>'+escapeHtml(d.name)+'</td><td>'+escapeHtml(d.contact)+'</td><td>'+escapeHtml(d.email)+'</td><td>'+escapeHtml(d.phone)+'</td><td>'+(d.website?'<a href="'+escapeHtml(safeUrl(d.website))+'" target="_blank" rel="noopener">Website</a>':'')+'</td><td>'+escapeHtml(d.town)+'</td><td><button class="secondary" data-move="'+escapeHtml(d.id)+'">'+(active?'Move to prospects':'Activate dealer')+'</button></td></tr>')));document.getElementById('dealer-form').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));state.dealers.push({id:id(),status:active?'active':'prospect',displays:[],...d});save();render();notice('Dealer added')});p.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const d=state.dealers.find(x=>x.id===b.dataset.move);d.status=active?'prospect':'active';save();render();notice('Dealer moved')}));return}
if(current==='displays'){const dealers=state.dealers.filter(d=>d.status==='active');p.innerHTML=panel('Showroom displays','<form id="display-form">'+select('Dealer','dealerId',[['','Select active dealer'],...dealers.map(d=>[d.id,d.name])])+field('Fireplace / stove model','model','text','','required')+field('Date installed','installed','date')+field('Display quantity','quantity','number',1,'min="1"')+'<div class="wide actions"><button class="primary" type="submit">Add showroom display</button></div></form>')+panel('Installed displays',rows(['Dealer','Product','Quantity','Installed'],dealers.flatMap(d=>(d.displays||[]).map(x=>'<tr><td>'+escapeHtml(d.name)+'</td><td>'+escapeHtml(x.model)+'</td><td>'+escapeHtml(x.quantity)+'</td><td>'+escapeHtml(x.installed)+'</td></tr>'))));document.getElementById('display-form').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const dealer=state.dealers.find(x=>x.id===d.dealerId);if(!dealer){notice('Select active dealer');return}dealer.displays=dealer.displays||[];dealer.displays.push({model:d.model,installed:d.installed,quantity:d.quantity});save();render();notice('Showroom display added')});}}
function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
function backup(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bains-fireplaces-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.orders)||!Array.isArray(d.customers)||!Array.isArray(d.dealers))throw Error('Invalid backup');if(!confirm('Replace all data in this browser with this backup?'))return;state=d;save();render();notice('Backup restored')}catch{notice('Invalid backup file')}}
load();go('dashboard');
</script></body></html>
